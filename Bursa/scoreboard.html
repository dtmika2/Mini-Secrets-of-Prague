<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bursa - Žebříček</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A0A0A">
  <style>
    @font-face {
      font-family: 'Archivo';
      src: url('fonts/archivo-var-latin-ext.woff2') format('woff2');
      font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
                     U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
                     U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Archivo';
      src: url('fonts/archivo-var-latin.woff2') format('woff2');
      font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                     U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
                     U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:   #F2F1EE;
      --paper-2: #E7E6E2;
      --ink:     #0A0A0A;
      --ink-dim: #6E6E68;
      --mint:    #00FA9E;
      --edge:    2px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Archivo', 'Helvetica Neue', Arial, system-ui, sans-serif;
      font-stretch: 100%;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      width: 100vw; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 3vh 4vw;
      gap: 1.6vh;
    }

    .head-row {
      width: 79.2vw;
      display: flex; align-items: center; justify-content: space-between;
      gap: 2vw;
    }
    .logo-mark { width: clamp(90px, 9vw, 150px); height: auto; display: block; }
    .title {
      font-weight: 900; font-stretch: 125%;
      text-transform: uppercase; letter-spacing: -0.015em;
      line-height: 0.9;
      font-size: 4vw;
    }

    .live-row {
      display: flex; align-items: center; gap: 0.6em;
      border: var(--edge) solid var(--ink);
      background: var(--mint);
      padding: 0.3em 0.8em;
    }
    .live-dot {
      width: 0.62vw; height: 0.62vw; min-width: 8px; min-height: 8px;
      border-radius: 50%;
      background: var(--ink);
      animation: livePulse 2s ease-in-out infinite;
    }
    .live-label {
      font-weight: 800; font-stretch: 112%;
      font-size: 0.95vw;
      text-transform: uppercase; letter-spacing: 0.22em;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.25; transform: scale(0.6); }
    }

    .sb-wrap {
      width: 79.2vw;
      max-height: 79vh;
      overflow-y: auto;
      border: var(--edge) solid var(--ink);
      background: var(--paper);
    }
    .sb-wrap::-webkit-scrollbar { width: 0; }

    .sb-table { width: 100%; border-collapse: collapse; }
    .sb-table thead th {
      position: sticky; top: 0;
      background: var(--ink);
      color: var(--paper);
      font-weight: 800; font-stretch: 112%;
      text-transform: uppercase; letter-spacing: 0.14em;
      font-size: 0.9vw;
      padding: 0.7em 1.2em;
      text-align: left;
    }
    .sb-table td {
      font-weight: 500;
      font-size: 1.15vw;
      padding: 0.45em 1.2em;
      border-bottom: 1px solid rgba(10, 10, 10, 0.14);
    }
    .sb-table tr:last-child td { border-bottom: none; }
    .sb-table th:nth-child(3), .sb-table td:nth-child(3),
    .sb-table th:nth-child(4), .sb-table td:nth-child(4) { text-align: right; }
    .sb-table td:nth-child(1) { font-weight: 800; font-variant-numeric: tabular-nums; width: 5em; white-space: nowrap; }
    .sb-table td:nth-child(3) { font-weight: 800; font-variant-numeric: tabular-nums; }
    .sb-table .r1 td { background: var(--mint); font-weight: 800; }
    .sb-table .r1 td:first-child::after { content: ' ★'; }
    .sb-table .r2 td, .sb-table .r3 td { background: var(--paper-2); }

    .sb-empty {
      padding: 3em; text-align: center;
      color: var(--ink-dim); font-weight: 500; font-size: 1.1vw;
    }
  </style>
</head>
<body>
<div class="screen">
  <div class="head-row">
    <img class="logo-mark" src="assets/bursa-logo-ink.svg" alt="Bursa">
    <h1 class="title">Žebříček</h1>
    <div class="live-row">
      <span class="live-dot"></span>
      <span class="live-label">Živě</span>
    </div>
  </div>
  <div class="sb-wrap">
    <table class="sb-table">
      <thead>
        <tr><th>#</th><th>Jméno</th><th>Body</th><th>Správně</th></tr>
      </thead>
      <tbody id="sb-body"></tbody>
    </table>
  </div>
</div>

<script>
/* Paste the Bursa Apps Script web-app URL here - must match the one in index.html. */
const SHEET_URL       = 'https://script.google.com/macros/s/AKfycbzKXXil9toHA0IZEg2TV6wjstHal1vMOfJIADcn7aAoPgGUtv3WKprh_aJpFcexYNgfAQ/exec';
const STORE_KEY       = 'bursaScores_v1';
const MAX_QS          = 6;
const SCROLL_SPEED    = 28;   // px / second
const PAUSE_TOP_MS    = 4000;
const PAUSE_BOTTOM_MS = 3000;

let scrollTicker = null;
let scrollTimer  = null;
let cachedRows   = [];

function sheetConfigured() {
  return SHEET_URL && !SHEET_URL.startsWith('PASTE_');
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}

async function fetchScores() {
  // With no Sheet deployed yet, fall back to this device's own localStorage so
  // the board still works on a single machine.
  if (!sheetConfigured()) {
    cachedRows = loadLocal();
    return cachedRows;
  }
  try {
    const res  = await fetch(SHEET_URL, { redirect: 'follow' });
    const rows = JSON.parse(await res.text());
    if (!Array.isArray(rows)) throw new Error('bad response');
    rows.sort((a, b) => b.score - a.score || b.correct - a.correct);
    if (rows.length > 100) rows.length = 100;
    cachedRows = rows;
  } catch { /* keep cachedRows as-is on failure */ }
  return cachedRows;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function stopScrollCycle() {
  clearInterval(scrollTicker);
  clearTimeout(scrollTimer);
  scrollTicker = scrollTimer = null;
}

function startScrollCycle(wrap) {
  stopScrollCycle();

  function doScrollDown() {
    const maxScroll = wrap.scrollHeight - wrap.clientHeight;
    if (maxScroll <= 0) { scrollTimer = null; return; }

    let last = performance.now();
    let pos  = 0; // float position - never read back from scrollTop, to avoid rounding loss
    // setInterval keeps firing when the window isn't focused, unlike rAF
    scrollTicker = setInterval(() => {
      const now = performance.now();
      const dt  = Math.min(now - last, 100);
      last = now;
      pos += SCROLL_SPEED * dt / 1000;
      if (pos >= maxScroll) {
        wrap.scrollTop = maxScroll;
        clearInterval(scrollTicker);
        scrollTicker = null;
        scrollTimer = setTimeout(render, PAUSE_BOTTOM_MS);
        return;
      }
      wrap.scrollTop = pos;
    }, 16);
  }

  scrollTimer = setTimeout(doScrollDown, PAUSE_TOP_MS);
}

async function render() {
  stopScrollCycle();
  const wrap  = document.querySelector('.sb-wrap');
  const tbody = document.getElementById('sb-body');
  const rows  = await fetchScores();

  wrap.scrollTop = 0;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="sb-empty">Zatím žádné skóre - buď první!</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((r, i) => {
    const rank = ['r1', 'r2', 'r3'][i] || '';
    return `<tr class="${rank}">
      <td>${i + 1}</td>
      <td>${esc(r.name)}</td>
      <td>${r.score}</td>
      <td>${r.correct} / ${MAX_QS}</td>
    </tr>`;
  }).join('');

  startScrollCycle(wrap);
}

setInterval(() => { if (!scrollTicker && !scrollTimer) render(); }, 20000);

render();
// Re-measure once webfonts land, since they change row heights
document.fonts.ready.then(() => { if (!scrollTicker && !scrollTimer) render(); });
</script>
</body>
</html>
